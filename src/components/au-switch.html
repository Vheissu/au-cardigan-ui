<div class="field ${size} ${disabled ? 'is-disabled' : ''} ${checked ? 'is-checked' : ''} ${error ? 'has-error' : ''}">
  <label class="switch" part="label">
    <input
      type="checkbox"
      class="native"
      part="input"
      checked.bind="checked"
      disabled.bind="disabled"
      required.bind="required"
      id.bind="controlId"
      name.bind="name"
      aria-checked.bind="checked"
      aria-invalid.bind="!!error"
      aria-describedby.bind="describedBy"
      change.trigger="handleChange($event)"
    />
    <span class="track" part="track">
      <span class="thumb" part="thumb"></span>
    </span>
    <div class="content" part="content">
      <span class="label" part="text">${label}</span>
      <span if.bind="description" class="description" part="description">${description}</span>
    </div>
  </label>
  <p if.bind="error" id.bind="errorId" class="message error" part="message error">
    ${error}
  </p>
  <p else.if.bind="helper" id.bind="helperId" class="message helper" part="message helper">
    ${helper}
  </p>
</div>
